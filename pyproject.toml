[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wad-deobf"
version = "0.3.0"
description = "Static deobfuscator for WeAreDevs WAD Lua/Luau output"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AnnonyA"}]
dependencies = []

[project.scripts]
wad-deobf = "wad_deobf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
